name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test -p trace-parser
      - run: cargo test -p trace-core
      - run: cargo check -p trace-mcp

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src-web/package-lock.json
      - run: npm ci
      - run: npm run check:ui-guards
      - run: npm run test:ui
      - run: npm run build
