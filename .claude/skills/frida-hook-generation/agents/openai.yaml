interface:
  display_name: "Frida Hook Generation"
  short_description: "Generate Frida 16 hooks and inspect captures"
  default_prompt: "Use $frida-hook-generation to generate a Frida 16.x hook I will run manually, or inspect my captured JSON and create an angr state seed."

dependencies:
  tools:
    - type: "mcp"
      value: "trace-ui"
      description: "Local Trace UI Frida 16 generator, capture inspector, and angr seed bridge"
      transport: "streamable_http"
      url: "http://127.0.0.1:19821/mcp"

policy:
  allow_implicit_invocation: true
