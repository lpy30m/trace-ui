interface:
  display_name: "Frida Hook Generation"
  short_description: "Generate Frida hooks, attest images, infer ABI candidates"
  default_prompt: "Use $frida-hook-generation to generate a manual Frida 16.x hook or runtime-image attestation, inspect repeated captures for conservative ABI/structure candidates, or hand exact-offset state to crypto/angr/Unicorn/OLLVM workflows."

dependencies:
  tools:
    - type: "mcp"
      value: "trace-ui"
      description: "Local Trace UI Frida 16 generator, runtime-image verifier, repeated-call ABI candidate analyzer, capture crypto analyzer, and exact-offset angr/OLLVM seed bridge"
      transport: "streamable_http"
      url: "http://127.0.0.1:19821/mcp"

policy:
  allow_implicit_invocation: true
