interface:
  display_name: "Frida Hook Generation"
  short_description: "Generate Frida 16 hooks and analyze captures"
  default_prompt: "Use $frida-hook-generation to generate a manual Frida 16.x hook, or inspect an exact-offset capture for crypto materials and angr/OLLVM state seeds."

dependencies:
  tools:
    - type: "mcp"
      value: "trace-ui"
      description: "Local Trace UI Frida 16 generator, capture crypto analyzer, and exact-offset angr/OLLVM seed bridge"
      transport: "streamable_http"
      url: "http://127.0.0.1:19821/mcp"

policy:
  allow_implicit_invocation: true
