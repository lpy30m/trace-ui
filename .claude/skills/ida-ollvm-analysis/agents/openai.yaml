interface:
  display_name: "IDA and angr OLLVM Analysis"
  short_description: "Bridge OLLVM, Frida, IDA, and bounded angr flows"
  default_prompt: "Use $ida-ollvm-analysis to compare OLLVM state and branch evidence, then generate manual IDA/angr bridges with optional exact-offset Frida seeds and bounded symbolic flows."

dependencies:
  tools:
    - type: "mcp"
      value: "trace-ui"
      description: "Local Trace UI dynamic OLLVM, exact-offset Frida seed, IDA, and bounded angr flow bridge server"
      transport: "streamable_http"
      url: "http://127.0.0.1:19821/mcp"

policy:
  allow_implicit_invocation: true
