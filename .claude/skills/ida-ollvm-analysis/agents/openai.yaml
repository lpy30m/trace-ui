interface:
  display_name: "IDA and angr OLLVM Analysis"
  short_description: "Reconcile OLLVM traces with IDA and angr"
  default_prompt: "Use $ida-ollvm-analysis to analyze this trace for OLLVM candidates and generate manual IDA or angr bridges."

dependencies:
  tools:
    - type: "mcp"
      value: "trace-ui"
      description: "Local Trace UI dynamic OLLVM, IDA, and angr bridge server"
      transport: "streamable_http"
      url: "http://127.0.0.1:19821/mcp"

policy:
  allow_implicit_invocation: true
